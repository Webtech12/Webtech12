<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="JetBrains Mono, Fira Code, Cascadia Code, Consolas, monospace">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="480" rx="14" fill="#0d1117"/>
  <rect width="960" height="480" rx="14" fill="url(#grid)"/>
  <ellipse cx="300" cy="230" rx="280" ry="210" fill="url(#halo)"/>

  <text x="534" y="44" fill="#8b949e" font-size="12" letter-spacing="3">HOW I THINK ABOUT A SYSTEM</text>

  <!-- ===== LAYER 01 · DATA (bottom) ===== -->
  <g transform="translate(300 350)">
    <animateTransform attributeName="transform" type="translate" values="300 350;300 345;300 350" dur="3.6s" repeatCount="indefinite" begin="0s"/>
    <polygon points="-140,0 0,70 0,94 -140,24" fill="#0f3d43"/>
    <polygon points="0,70 140,0 140,24 0,94" fill="#155158"/>
    <polygon points="0,-70 140,0 0,70 -140,0" fill="#1c6a72" stroke="#2fa3ad" stroke-width="1"/>
    <polyline points="-140,0 0,70 140,0" fill="none" stroke="#000" stroke-opacity="0.3"/>
    <text x="-95" y="6" fill="#e6edf3" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">DATA</text>
    <g transform="translate(45 28)"><polygon points="-10,0 0,5 0,12 -10,7" fill="#0a2a2e"/><polygon points="0,5 10,0 10,7 0,12" fill="#0e3a3f"/><polygon points="0,-5 10,0 0,5 -10,0" fill="#3ddbd9"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" begin="0s"/></polygon></g>
    <g transform="translate(78 14)"><polygon points="-10,0 0,5 0,12 -10,7" fill="#0a2a2e"/><polygon points="0,5 10,0 10,7 0,12" fill="#0e3a3f"/><polygon points="0,-5 10,0 0,5 -10,0" fill="#3ddbd9"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" begin="-0.7s"/></polygon></g>
    <g transform="translate(108 -1)"><polygon points="-10,0 0,5 0,12 -10,7" fill="#0a2a2e"/><polygon points="0,5 10,0 10,7 0,12" fill="#0e3a3f"/><polygon points="0,-5 10,0 0,5 -10,0" fill="#3ddbd9"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" begin="-1.4s"/></polygon></g>
    <text x="-160" y="5" fill="#484f58" font-size="12" text-anchor="end">01</text>
    <line x1="140" y1="0" x2="222" y2="0" stroke="#30363d" stroke-width="1"/>
    <circle cx="222" cy="0" r="3" fill="#3ddbd9"/>
    <text x="234" y="-3" fill="#e6edf3" font-size="13" font-weight="700">DATA</text>
    <text x="234" y="15" fill="#8b949e" font-size="11">MSSQL · MySQL · MongoDB · Redis · indexes first</text>
    <g fill="#3ddbd9" fill-opacity="0.8">
      <rect x="560" y="2" width="5" height="6"><animate attributeName="height" values="6;16;9;14;6" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="2;-8;-1;-6;2" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="568" y="-4" width="5" height="12"><animate attributeName="height" values="12;5;15;8;12" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="-4;3;-7;0;-4" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="576" y="-1" width="5" height="9"><animate attributeName="height" values="9;14;6;16;9" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="-1;-6;2;-8;-1" dur="1.7s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- ===== LAYER 02 · ASYNC WORK ===== -->
  <g transform="translate(300 265)">
    <animateTransform attributeName="transform" type="translate" values="300 265;300 260;300 265" dur="3.6s" repeatCount="indefinite" begin="-0.6s"/>
    <polygon points="-140,0 0,70 0,94 -140,24" fill="#5a3a0e"/>
    <polygon points="0,70 140,0 140,24 0,94" fill="#7a4f13"/>
    <polygon points="0,-70 140,0 0,70 -140,0" fill="#a2691b" stroke="#e3b341" stroke-width="1"/>
    <polyline points="-140,0 0,70 140,0" fill="none" stroke="#000" stroke-opacity="0.3"/>
    <text x="-95" y="6" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">ASYNC</text>
    <g transform="translate(45 28)"><polygon points="-10,0 0,5 0,12 -10,7" fill="#3d2708"/><polygon points="0,5 10,0 10,7 0,12" fill="#54360b"/><polygon points="0,-5 10,0 0,5 -10,0" fill="#ffd166"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" begin="0s"/></polygon></g>
    <g transform="translate(78 14)"><polygon points="-10,0 0,5 0,12 -10,7" fill="#3d2708"/><polygon points="0,5 10,0 10,7 0,12" fill="#54360b"/><polygon points="0,-5 10,0 0,5 -10,0" fill="#ffd166"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" begin="-0.5s"/></polygon></g>
    <g transform="translate(108 -1)"><polygon points="-10,0 0,5 0,12 -10,7" fill="#3d2708"/><polygon points="0,5 10,0 10,7 0,12" fill="#54360b"/><polygon points="0,-5 10,0 0,5 -10,0" fill="#ffd166"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite" begin="-1s"/></polygon></g>
    <text x="-160" y="5" fill="#484f58" font-size="12" text-anchor="end">02</text>
    <line x1="140" y1="0" x2="222" y2="0" stroke="#30363d" stroke-width="1"/>
    <circle cx="222" cy="0" r="3" fill="#e3b341"/>
    <text x="234" y="-3" fill="#e6edf3" font-size="13" font-weight="700">ASYNC WORK</text>
    <text x="234" y="15" fill="#8b949e" font-size="11">queues · workers · events · retries · backoff</text>
    <g fill="#e3b341" fill-opacity="0.8">
      <rect x="560" y="2" width="5" height="6"><animate attributeName="height" values="6;16;9;14;6" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="2;-8;-1;-6;2" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="568" y="-4" width="5" height="12"><animate attributeName="height" values="12;5;15;8;12" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="-4;3;-7;0;-4" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="576" y="-1" width="5" height="9"><animate attributeName="height" values="9;14;6;16;9" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="-1;-6;2;-8;-1" dur="1.3s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- ===== LAYER 03 · API ===== -->
  <g transform="translate(300 180)">
    <animateTransform attributeName="transform" type="translate" values="300 180;300 175;300 180" dur="3.6s" repeatCount="indefinite" begin="-1.2s"/>
    <polygon points="-140,0 0,70 0,94 -140,24" fill="#16325f"/>
    <polygon points="0,70 140,0 140,24 0,94" fill="#1d4383"/>
    <polygon points="0,-70 140,0 0,70 -140,0" fill="#2a5db5" stroke="#58a6ff" stroke-width="1"/>
    <polyline points="-140,0 0,70 140,0" fill="none" stroke="#000" stroke-opacity="0.3"/>
    <text x="-95" y="6" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">API</text>
    <g transform="translate(45 28)"><polygon points="-10,0 0,5 0,12 -10,7" fill="#0f2447"/><polygon points="0,5 10,0 10,7 0,12" fill="#15305e"/><polygon points="0,-5 10,0 0,5 -10,0" fill="#9ecbff"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite" begin="-0.2s"/></polygon></g>
    <g transform="translate(78 14)"><polygon points="-10,0 0,5 0,12 -10,7" fill="#0f2447"/><polygon points="0,5 10,0 10,7 0,12" fill="#15305e"/><polygon points="0,-5 10,0 0,5 -10,0" fill="#9ecbff"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite" begin="-0.8s"/></polygon></g>
    <g transform="translate(108 -1)"><polygon points="-10,0 0,5 0,12 -10,7" fill="#0f2447"/><polygon points="0,5 10,0 10,7 0,12" fill="#15305e"/><polygon points="0,-5 10,0 0,5 -10,0" fill="#9ecbff"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite" begin="-1.4s"/></polygon></g>
    <text x="-160" y="5" fill="#484f58" font-size="12" text-anchor="end">03</text>
    <line x1="140" y1="0" x2="222" y2="0" stroke="#30363d" stroke-width="1"/>
    <circle cx="222" cy="0" r="3" fill="#58a6ff"/>
    <text x="234" y="-3" fill="#e6edf3" font-size="13" font-weight="700">API</text>
    <text x="234" y="15" fill="#8b949e" font-size="11">NestJS · .NET · REST · GraphQL · WebSockets</text>
    <g fill="#58a6ff" fill-opacity="0.8">
      <rect x="560" y="2" width="5" height="6"><animate attributeName="height" values="6;16;9;14;6" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="2;-8;-1;-6;2" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="568" y="-4" width="5" height="12"><animate attributeName="height" values="12;5;15;8;12" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-4;3;-7;0;-4" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="576" y="-1" width="5" height="9"><animate attributeName="height" values="9;14;6;16;9" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="-1;-6;2;-8;-1" dur="1.1s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- ===== LAYER 04 · CLIENTS (top) ===== -->
  <g transform="translate(300 95)">
    <animateTransform attributeName="transform" type="translate" values="300 95;300 90;300 95" dur="3.6s" repeatCount="indefinite" begin="-1.8s"/>
    <polygon points="-140,0 0,70 0,94 -140,24" fill="#3b2a6e"/>
    <polygon points="0,70 140,0 140,24 0,94" fill="#4f3a92"/>
    <polygon points="0,-70 140,0 0,70 -140,0" fill="#6e4fc4" stroke="#bc8cff" stroke-width="1"/>
    <polyline points="-140,0 0,70 140,0" fill="none" stroke="#000" stroke-opacity="0.3"/>
    <text x="-95" y="6" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">CLIENTS</text>
    <g transform="translate(45 28)"><polygon points="-10,0 0,5 0,12 -10,7" fill="#261b4a"/><polygon points="0,5 10,0 10,7 0,12" fill="#332562"/><polygon points="0,-5 10,0 0,5 -10,0" fill="#d2a8ff"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" begin="-0.4s"/></polygon></g>
    <g transform="translate(78 14)"><polygon points="-10,0 0,5 0,12 -10,7" fill="#261b4a"/><polygon points="0,5 10,0 10,7 0,12" fill="#332562"/><polygon points="0,-5 10,0 0,5 -10,0" fill="#d2a8ff"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" begin="-1.2s"/></polygon></g>
    <g transform="translate(108 -1)"><polygon points="-10,0 0,5 0,12 -10,7" fill="#261b4a"/><polygon points="0,5 10,0 10,7 0,12" fill="#332562"/><polygon points="0,-5 10,0 0,5 -10,0" fill="#d2a8ff"><animate attributeName="fill-opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" begin="-2s"/></polygon></g>
    <text x="-160" y="5" fill="#484f58" font-size="12" text-anchor="end">04</text>
    <line x1="140" y1="0" x2="222" y2="0" stroke="#30363d" stroke-width="1"/>
    <circle cx="222" cy="0" r="3" fill="#bc8cff"/>
    <text x="234" y="-3" fill="#e6edf3" font-size="13" font-weight="700">CLIENTS</text>
    <text x="234" y="15" fill="#8b949e" font-size="11">React · Next.js · React Native · admin tools</text>
    <g fill="#bc8cff" fill-opacity="0.8">
      <rect x="560" y="2" width="5" height="6"><animate attributeName="height" values="6;16;9;14;6" dur="2s" repeatCount="indefinite"/><animate attributeName="y" values="2;-8;-1;-6;2" dur="2s" repeatCount="indefinite"/></rect>
      <rect x="568" y="-4" width="5" height="12"><animate attributeName="height" values="12;5;15;8;12" dur="2s" repeatCount="indefinite"/><animate attributeName="y" values="-4;3;-7;0;-4" dur="2s" repeatCount="indefinite"/></rect>
      <rect x="576" y="-1" width="5" height="9"><animate attributeName="height" values="9;14;6;16;9" dur="2s" repeatCount="indefinite"/><animate attributeName="y" values="-1;-6;2;-8;-1" dur="2s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- ===== the request / response path through every layer ===== -->
  <line x1="240" y1="18" x2="240" y2="440" stroke="#58a6ff" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- requests going down -->
  <circle cx="240" r="5" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cy" values="18;440" dur="3s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="3s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="240" r="5" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cy" values="18;440" dur="3s" repeatCount="indefinite" begin="-1.5s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="3s" repeatCount="indefinite" begin="-1.5s"/>
  </circle>
  <!-- responses coming back up -->
  <circle cx="240" r="4" fill="#3fb950" filter="url(#glow)">
    <animate attributeName="cy" values="440;18" dur="3s" repeatCount="indefinite" begin="-0.75s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="3s" repeatCount="indefinite" begin="-0.75s"/>
  </circle>
  <circle cx="240" r="4" fill="#3fb950" filter="url(#glow)">
    <animate attributeName="cy" values="440;18" dur="3s" repeatCount="indefinite" begin="-2.25s"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="3s" repeatCount="indefinite" begin="-2.25s"/>
  </circle>
  <!-- and one that fails, and gets retried -->
  <circle cx="240" r="5" fill="#f85149" filter="url(#glow)">
    <animate attributeName="cy" values="18;262;262;262" keyTimes="0;0.35;0.5;1" dur="9s" repeatCount="indefinite" begin="-4s"/>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.42;0.5;1" dur="9s" repeatCount="indefinite" begin="-4s"/>
    <animate attributeName="r" values="5;5;5;14;5" keyTimes="0;0.35;0.42;0.5;1" dur="9s" repeatCount="indefinite" begin="-4s"/>
  </circle>

  <text x="36" y="452" fill="#8b949e" font-size="12">
    <tspan fill="#ffffff">●</tspan> request down  <tspan fill="#3fb950">●</tspan> response back  <tspan fill="#f85149">●</tspan> one fails and retries  —  every hop can break, so I design that path first
  </text>
</svg>
